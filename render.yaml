# Render Blueprint. База данных — внешняя (Neon), поэтому здесь только веб-сервис.
# Секреты (DATABASE_*) задаются в дашборде Render (sync: false — не хранятся в репозитории).
services:
  - type: web
    name: school-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # JDBC-URL базы Neon, например:
      #   jdbc:postgresql://ep-xxx-pooler.eu-central-1.aws.neon.tech/school?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # PORT Render подставляет автоматически — задавать не нужно.
