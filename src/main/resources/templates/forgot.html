<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{page.forgot})}"></head>
<body>
<div class="login-wrap">
    <div class="lang-login">
        <span th:replace="~{fragments/common :: langswitch}"></span>
    </div>
    <h1 th:text="#{forgot.heading}">Восстановление пароля</h1>
    <p class="muted small" th:text="#{forgot.desc}">Введите email — пришлём ссылку для сброса пароля.</p>
    <div class="card">
        <div th:if="${param.sent}" class="notice" th:text="#{forgot.sent}">Если аккаунт существует, письмо отправлено.</div>
        <form th:action="@{/forgot}" method="post" th:unless="${param.sent}">
            <label for="email" th:text="#{forgot.email}">Email</label>
            <input type="email" id="email" name="email" autofocus required>
            <button class="btn" type="submit" style="width:100%" th:text="#{forgot.submit}">Отправить ссылку</button>
        </form>
        <p class="small" style="margin-top:.8rem; text-align:center">
            <a th:href="@{/login}" th:text="#{forgot.backToLogin}">← Ко входу</a>
        </p>
    </div>
</div>
</body>
</html>
