<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{page.teacherHome})}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="container">
    <h1 th:text="#{teacherHome.heading}">Моё расписание</h1>

    <div class="card" th:if="${!supervisedClasses.isEmpty()}">
        <h3 th:text="#{teacherHome.supervisorTitle}">Я классный руководитель</h3>
        <p class="muted small" th:text="#{teacherHome.supervisorDesc}">Полный доступ к расписанию и данным этих групп:</p>
        <p th:each="c : ${supervisedClasses}">
            <a class="btn tiny secondary" th:href="@{/teacher/class/{id}(id=${c.id})}" th:text="${c.name}">Группа</a>
        </p>
    </div>

    <div class="week-nav">
        <a class="btn tiny secondary" th:href="@{/teacher(week=${week - 1})}" th:text="#{week.prev}">← Предыдущая</a>
        <span class="muted" th:text="${#temporals.format(monday,'dd.MM')} + ' — ' + ${#temporals.format(sunday,'dd.MM.yyyy')}"></span>
        <a class="btn tiny secondary" th:href="@{/teacher(week=${week + 1})}" th:text="#{week.next}">Следующая →</a>
        <a class="btn tiny secondary" th:href="@{/teacher}" th:if="${week != 0}" th:text="#{week.current}">Текущая</a>
    </div>

    <div class="grid-days">
        <div class="day" th:each="d : ${days}" th:classappend="${d.today} ? ' today' : ''">
            <h3>
                <span th:text="#{'day.' + ${d.date.dayOfWeek.name()}}">День</span>
                <span class="date" th:text="${#temporals.format(d.date,'dd.MM')}"></span>
            </h3>
            <p class="muted small" th:if="${d.lessons.isEmpty()}" th:text="#{day.none}">Нет занятий</p>
            <div class="lesson-line" th:each="l : ${d.lessons}">
                <span class="time" th:text="${#temporals.format(l.startTime,'HH:mm')}"></span>
                <a th:href="@{/teacher/lesson/{id}(id=${l.id})}"
                   th:text="${l.subject.name} + ' · ' + ${l.schoolClass.name}">Урок</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
