<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{page.classes})}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="container">
    <h1 th:text="#{classes.heading}">Группы</h1>
    <div th:replace="~{fragments/common :: flash}"></div>

    <div class="card">
        <table>
            <thead><tr>
                <th th:text="#{classes.colName}">Название</th>
                <th th:text="#{classes.colSupervisor}">Классный руководитель</th>
                <th th:text="#{common.actions}">Действия</th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${classes}">
                <td th:text="${c.name}">1年A組</td>
                <td th:text="${c.supervisor != null ? c.supervisor.fullName : '—'}">—</td>
                <td>
                    <div class="actions">
                        <a class="btn tiny secondary" th:href="@{/admin/classes/{id}/edit(id=${c.id})}" th:text="#{action.edit}">Редактировать</a>
                        <form th:action="@{/admin/classes/{id}/delete(id=${c.id})}" method="post"
                              th:attr="data-msg=#{common.confirmDelete}" onsubmit="return confirm(this.dataset.msg)">
                            <button class="btn tiny secondary" type="submit" th:text="#{action.delete}">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3 th:text="#{classes.new}">Новая группа</h3>
        <form th:action="@{/admin/classes}" method="post">
            <div class="row">
                <label><span th:text="#{classes.studyYear}">Год обучения</span>
                    <input type="number" name="studyYear" min="1" max="12" required></label>
                <label><span th:text="#{classes.groupCode}">Код группы</span>
                    <input type="text" name="groupCode" required placeholder="A"></label>
            </div>
            <label><span th:text="#{classes.supervisor}">Классный руководитель</span>
                <select name="supervisorId">
                    <option value="" th:text="#{classes.assignLater}">— назначить позже —</option>
                    <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
                </select>
            </label>
            <button class="btn" type="submit" th:text="#{action.create}">Создать</button>
        </form>
    </div>
</div>
</body>
</html>
