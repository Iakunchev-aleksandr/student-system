<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{journal.heading})}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<div class="container">
    <h1 th:text="#{journal.heading}">Журнал</h1>
    <p class="muted" th:text="#{journal.desc}">Выберите группу и неделю, откройте урок, чтобы редактировать оценки и посещаемость.</p>

    <div class="card">
        <form th:action="@{/admin/journal}" method="get">
            <label><span th:text="#{journal.selectClass}">Группа</span>
                <select name="classId" onchange="this.form.submit()">
                    <option value="" th:text="#{common.none}">— нет —</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${selectedClassId != null and selectedClassId == c.id}"></option>
                </select>
            </label>
            <input type="hidden" name="week" th:value="${week}">
        </form>
    </div>

    <p class="muted" th:if="${clazz == null}" th:text="#{journal.noClass}">Выберите группу.</p>

    <div th:if="${clazz != null}">
        <div class="week-nav">
            <a class="btn tiny secondary" th:href="@{/admin/journal(classId=${clazz.id},week=${week - 1})}" th:text="#{week.prev}">← Предыдущая</a>
            <span class="muted" th:text="${#temporals.format(monday,'dd.MM')} + ' — ' + ${#temporals.format(sunday,'dd.MM.yyyy')}"></span>
            <a class="btn tiny secondary" th:href="@{/admin/journal(classId=${clazz.id},week=${week + 1})}" th:text="#{week.next}">Следующая →</a>
            <a class="btn tiny secondary" th:href="@{/admin/journal(classId=${clazz.id})}" th:if="${week != 0}" th:text="#{week.current}">Текущая</a>
        </div>

        <div class="grid-days">
            <div class="day" th:each="d : ${days}" th:classappend="${d.today} ? ' today' : ''">
                <h3>
                    <span th:text="#{'day.' + ${d.date.dayOfWeek.name()}}">День</span>
                    <span class="date" th:text="${#temporals.format(d.date,'dd.MM')}"></span>
                </h3>
                <p class="muted small" th:if="${d.lessons.isEmpty()}" th:text="#{day.none}">Нет занятий</p>
                <div class="lesson-line" th:each="l : ${d.lessons}">
                    <span class="time" th:text="${#temporals.format(l.startTime,'HH:mm')}"></span>
                    <a th:href="@{/teacher/lesson/{id}(id=${l.id})}" th:text="${l.subject.name}">Предмет</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
