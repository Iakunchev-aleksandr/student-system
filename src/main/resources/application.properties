# --- База данных PostgreSQL ---
# Создай базу командой:  createdb school   (или через pgAdmin)
# и при необходимости поменяй логин/пароль ниже.
spring.datasource.url=jdbc:postgresql://localhost:5432/school
spring.datasource.username=postgres
spring.datasource.password=1234

# --- JPA / Hibernate ---
# update: схема создаётся/обновляется автоматически, данные сохраняются между запусками.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Локализация (i18n) ---
# Базовый файл messages.properties — японский (язык по умолчанию).
# messages_en.properties — английский, messages_ru.properties — русский.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Сервер ---
server.port=8080

# --- Загрузка файлов преподавателями ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads
