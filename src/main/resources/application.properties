# --- База данных PostgreSQL ---
# Значения берутся из переменных окружения (Render/Neon), иначе — локальные по умолчанию.
# На Neon URL должен быть в JDBC-формате с SSL, например:
#   jdbc:postgresql://<host>.neon.tech/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/school}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}

# --- JPA / Hibernate ---
# update: схема создаётся/обновляется автоматически, данные сохраняются между запусками.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Локализация (i18n) ---
# Базовый файл messages.properties — японский (язык по умолчанию).
# messages_en.properties — английский, messages_ru.properties — русский.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Сервер ---
# Render передаёт порт через $PORT (Dockerfile также подставляет его в java -jar).
server.port=${PORT:8080}

# --- Загрузка файлов преподавателями ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# На Render файловая система эфемерна: без подключённого Disk загруженные файлы
# пропадут при перезапуске/редеплое. При наличии диска укажите его путь через APP_UPLOAD_DIR.
app.upload-dir=${APP_UPLOAD_DIR:uploads}
